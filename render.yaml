services:
  - type: web
    name: cody-ai
    repo: https://github.com/crysnovax/CODY
    branch: main
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ping
    autoDeployTrigger: commit
    envVars:
      - key: OWNER_NUMBER
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: PREFIX
        value: "."
      - key: SESSION_ID
        sync: false
      - key: BOT_NAME
        value: Cody AI V2
